    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: root-app
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: 'https://github.com/Ohjinn/homelab-gitops.git'
        targetRevision: HEAD
        path: apps # 이 경로 안의 모든 Application YAML을 읽어들임
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
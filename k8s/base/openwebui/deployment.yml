apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui-system
spec:
  replicas: 1
  # 대화 기록이 SQLite 한 파일에 있고 PVC 가 RWO 다. 롤링으로 새 파드가 먼저
  # 뜨면 볼륨을 두 번 잡으려다 멈춘다. chroma 와 같은 이유다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          # 태그를 그대로 쓴다. digest 로 고정하면 아키텍처 전용이 되고,
          # main 은 상류가 계속 갱신하는 태그라 digest 를 박아 두면 업데이트를
          # 받으려면 매번 매니페스트를 고쳐야 한다.
          #
          # 이미지가 크다 — 레지스트리 매니페스트 기준 압축 1.82GB(레이어 19개),
          # 디스크에서 약 4GB. 이것 때문에 노드 디스크를 20G → 40G 로 늘렸다.
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
              name: http
          env:
            # ── 설정의 주인을 매니페스트로 되돌린다 ─────────────
            #
            # Open WebUI 는 상당수 환경변수를 **첫 기동 때만** 읽어 자기 DB 에
            # 저장하고, 그 뒤로는 DB 가 이긴다(PersistentConfig). 그래서 여기서
            # 값을 고쳐도 파드를 다시 띄우든 말든 반영되지 않는다.
            #
            # 실제로 걸렸다. 처음에 키를 'none;none' 으로 올렸다가 시크릿으로
            # 바꿨는데, DB 에는 계속 ["none","none"] 이 남아 litellm 모델이
            # 드롭다운에 뜨지 않았다. 매니페스트만 보면 고쳐진 것처럼 보인다.
            #
            # False 로 두면 매번 환경변수가 이긴다. GitOps 에서는 이쪽이 맞다 —
            # 레포에 선언한 것이 곧 도는 것이어야 한다. 대신 화면에서 연결을
            # 고쳐도 재시작하면 되돌아간다. 연결 설정은 여기서만 바꾼다.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "False"

            # ── 붙일 백엔드 두 개 ──────────────────────────────
            #
            # 세미콜론으로 여러 개를 준다. 모델 드롭다운에 두 쪽 모델이 모두
            # 뜨고, 대화마다 골라 쓸 수 있다.
            #
            #   rag-api  → 홈랩 문서를 아는 모델(homelab-rag). 검색한 청크만
            #              근거로 답한다.
            #   litellm  → 일반 모델. 맥북 Ollama, 실패하면 Gemini 로 폴백.
            #
            # 클러스터 안이라 인그레스를 안 탄다. rag-api 의 basicAuth 는
            # 인그레스에 걸려 있으므로 Service 로 직접 붙으면 자격증명이 없다.
            - name: OPENAI_API_BASE_URLS
              value: "http://rag-api.chroma-system.svc:8000/v1;http://litellm.litellm-system.svc:4000/v1"
            # 키도 세미콜론으로 URL 과 짝을 맞춘다. 개수가 다르면 Open WebUI 가
            # 짝을 못 짓는다.
            #
            #   rag-api  → 키가 없다. basicAuth 는 인그레스에만 걸려 있고
            #              Service 로 직접 붙으면 그 문을 안 지난다. 'none'.
            #   litellm  → LITELLM_MASTER_KEY 를 요구한다. 안 보내면 401 이다.
            #              처음에 'none' 으로 두었다가 실제로 401 을 받았다.
            #
            # 이 레포는 공개라 값을 매니페스트에 두지 않는다. 클러스터에 직접
            # 만들고 이름으로만 참조한다 — chroma·litellm 과 같은 규칙이다.
            #
            #   kubectl -n openwebui-system create secret generic openwebui-backends \
            #     --from-literal=OPENAI_API_KEYS="none;$LITELLM_MASTER_KEY"
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: openwebui-backends
                  key: OPENAI_API_KEYS

            # Ollama 연동은 끈다. 맥북 Ollama 에 직접 붙이면 모델 목록이
            # litellm 것과 겹쳐 같은 모델이 두 번 뜬다. 경로를 하나로 둔다.
            - name: ENABLE_OLLAMA_API
              value: "False"

            # ── 가입 통제 ─────────────────────────────────────
            #
            # 첫 계정이 관리자가 된다. 그 뒤로는 막는다 — 인그레스에 basicAuth 를
            # 걸지 않았으므로 집 안이나 tailnet 에 있는 누구든 화면에 닿는다.
            # 열어 두면 아무나 계정을 만들 수 있다.
            - name: ENABLE_SIGNUP
              value: "False"
            - name: DEFAULT_USER_ROLE
              value: "pending"

            # 상류로 사용 통계를 보내지 않는다. 코퍼스에 사내 코드가 있다.
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            - name: ANONYMIZED_TELEMETRY
              value: "False"

            # 내장 RAG 를 끈다. 우리는 청킹·임베딩·인덱싱을 직접 만들었고
            # rag-api 가 그것을 서비스한다. 여기서 또 문서를 벡터화하면
            # 코퍼스가 둘로 갈리고 어느 쪽이 답했는지 알 수 없게 된다.
            - name: ENABLE_RAG_WEB_SEARCH
              value: "False"
            - name: AUDIO_STT_ENGINE
              value: ""

            # ── 내장 비서 기능을 끈다 ──────────────────────────
            #
            # 이것들이 켜져 있으면 Open WebUI 가 "나는 메모를 쓰고 일정을
            # 관리하는 비서다" 라는 설명을 시스템 프롬프트에 붙인다. 그래서
            # Terraform 코드를 짜 달라고 했더니 모델이 이렇게 답했다 —
            #
            #   "저는 인프라를 프로비저닝하는 코드를 직접 작성할 수는
            #    없습니다. 저는 정보를 검색하고, 일정을 관리하며, 메모를
            #    작성하는 등의 기능을 수행하도록 설계되었습니다."
            #
            # 모델이 못 하는 게 아니라 **못 한다고 배운 것**이다. litellm 에
            # 직접 물으면 잘 답한다. 이 화면의 목적은 rag 와 일반 모델의
            # 답을 비교하는 것이라, 중간에서 성격을 입히면 비교가 성립하지
            # 않는다.
            #
            # 기본값이 전부 True 다(소스 config.py 에서 확인). 이름을 추측한
            # 것이 아니라 os.getenv 호출을 직접 보고 적었다.
            # 내장 도구도 붙이지 않는다.
            #
            # 도구 목록이 비어 있어도 Open WebUI 는 자기 내장 도구를 붙여
            # 보낸다(tools/builtin.py 에 ask_user·search_web·execute_code 등
            # 17 개). "너 이름이 뭐니?" 에 local-qwen 이 이렇게 답했다 —
            #
            #   {"name": "ask_user", "arguments": {"questions": [...]}}
            #
            # 도구 호출을 API 의 tool_calls 필드가 아니라 본문 텍스트로 뱉은
            # 것이다. litellm 에 직접 같은 질문을 하면 3/3 정상으로 "제 이름은
            # Qwen입니다" 라고 답한다. Ollama 를 거치는 qwen2.5 는 도구가
            # 붙으면 이런 식으로 새는 일이 있다.
            #
            # 붙일지 말지는 middleware.py 가 이렇게 정한다 —
            #
            #   use_builtin_tools = ... and params.function_calling != 'legacy'
            #
            # 이 화면의 목적은 rag 와 일반 모델의 답을 비교하는 것이라 도구가
            # 필요 없다. 나중에 도구를 쓰려면 도구를 제대로 다루는 모델
            # (gemini-chat)에만 대화 단위로 켜는 편이 낫다.
            - name: DEFAULT_MODEL_PARAMS
              value: '{"function_calling":"legacy"}'

            - name: ENABLE_NOTES
              value: "False"
            - name: ENABLE_CALENDAR
              value: "False"
            - name: ENABLE_AUTOMATIONS
              value: "False"
            - name: ENABLE_MEMORIES
              value: "False"

          volumeMounts:
            - name: data
              mountPath: /app/backend/data

          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              # 파이썬 백엔드 + SvelteKit 정적 파일이다. 추론은 전부 맥북에서
              # 돌아서 여기서 모델이 올라가는 일은 없다.
              memory: "1536Mi"
              cpu: "1000m"

          # 첫 기동에 마이그레이션이 돌아 1~2분 걸린다. 그동안 liveness 가
          # 죽이지 않도록 startupProbe 로 감싸고 한도를 5분으로 잡는다.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data

apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm-system
data:
  config.yaml: |
    model_list:
      - model_name: "default_assistant"
        # llama3.1 에서 qwen2.5:14b 로 바꿨다. HA Assist 로 집을 제어하려면
        # tool 호출이 정확해야 하는데, "서재 등만 남기고 다 꺼" 같은 부정·예외
        # 표현에서 llama3.1 과 qwen2.5 7B 는 정반대로 동작했다(끄지 말아야 할
        # 것만 껐다). 14b 는 맞혔다. 웜 3.6초라 속도도 쓸 만하다.
        litellm_params:
          model: "ollama/qwen2.5:14b"
          # 맥북(Mac M3). 공유기에서 static 으로 고정해 둔 주소다.
          api_base: "http://192.168.0.44:11434"

      - model_name: "gemini-fallback"
        # gemini-2.0-flash 는 무료 티어에서 429 만 돌려준다. 키도 모델도
        # 멀쩡한데(모델 목록에 여전히 있다) 무료 할당이 최신 모델 쪽으로
        # 옮겨간 것으로 보인다. 2.5-flash 는 같은 키로 바로 동작하고,
        # 위의 부정 표현 케이스도 맞혔다.
        litellm_params:
          model: "gemini/gemini-2.5-flash"
          api_key: "os.environ/GEMINI_API_KEY"

    general_settings:
      # Ingress 로 LAN 에 열면서 넣었다. 공개 DNS 에 올리지 않아 인터넷에서는
      # 못 오지만, 그건 집 안을 막아 주지 않는다. Host 헤더만 맞추면 LAN 의
      # 아무 기기나(Tailscale exit node 를 탄 것까지) 그냥 쓸 수 있고, 뒤에
      # Gemini 키가 물려 있어 남이 쓰면 무료 할당이 그대로 탄다.
      master_key: "os.environ/LITELLM_MASTER_KEY"

    litellm_settings:
      # 맥북(Ollama) 실패 시 Gemini로 자동 우회
      fallbacks:
        - default_assistant:
            - gemini-fallback
      # 맥북이 없을 때(들고 나가거나 잠들거나) 연결 시도 1 회가 3.05 초씩
      # 걸린다. 2 였을 때는 3 번 시도 + 백오프로 10 초 넘게 태우고 나서야
      # Gemini 로 넘어갔다. 음성 명령에는 치명적이라 1 로 줄인다.
      num_retries: 1
      request_timeout: 30

    router_settings:
      # 위의 재시도를 줄여도 맥북이 없는 동안 매 요청이 3 초씩 낸다.
      # 쿨다운은 한 번 실패한 배포를 일정 시간 후보에서 빼버려서, 세금을
      # 요청마다가 아니라 5 분에 한 번만 내게 한다.
      #
      # litellm 에는 "주기적으로 핑을 쏴서 살아있을 때만 보낸다" 는 기능이
      # 없다. 실패로 학습하는 이 방식이 가장 가까운 대안이다. 맥북이 다시
      # 켜지면 쿨다운이 끝난 뒤 첫 요청부터 자연히 로컬로 돌아간다.
      # 0 이어야 첫 실패에 바로 걸린다. 판정이 `updated_fails > allowed_fails`
      # 라서 1 로 두면 1 > 1 이 거짓이 되어 두 번째 실패까지 기다린다.
      # 맥북이 없는 동안 첫 두 요청이 각각 10 초 넘게 걸리는 걸 실제로 봤다.
      allowed_fails: 0
      cooldown_time: 300

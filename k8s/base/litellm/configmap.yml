apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm-system
data:
  config.yaml: |
    model_list:
      - model_name: "default_assistant"
        litellm_params:
          model: "ollama/llama3.1"
          api_base: "http://192.168.0.x:11434"   # 실제 맥북 내부 IP로 변경

      - model_name: "gemini-fallback"
        litellm_params:
          model: "gemini/gemini-2.0-flash"
          api_key: "os.environ/GEMINI_API_KEY"

    litellm_settings:
      # 맥북(Ollama) 실패 시 Gemini로 자동 우회
      fallbacks:
        - default_assistant:
            - gemini-fallback
      num_retries: 2
      request_timeout: 30

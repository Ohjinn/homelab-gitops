apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          # main-latest 는 움직이는 태그라 파드가 다시 뜰 때마다 내용이 바뀔 수
          # 있다. 실제로 이 digest 와 현재 main-latest 는 이미 서로 다른 이미지다.
          # 그래서 지금 안정적으로 도는 것(litellm 1.82.6)을 digest 로 고정한다.
          # 올릴 때는 새 digest 를 확인해서 이 줄만 바꾼다.
          image: ghcr.io/berriai/litellm@sha256:7c311546c25e7bb6e8cafede9fcd3d0d622ac636b5c9418befaa32e85dfb0186
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: GEMINI_API_KEY
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          # 기동 후 80초쯤 지나 메모리가 한도를 넘으면서 커널에 죽었다.
          # 60일간 5,842회 재시작한 원인이 이것이고, 커널 로그에
          # "Memory cgroup out of memory: Killed process (litellm)" 로 남았다.
          # OOM 희생자가 PID 1 이 아닌 자식 프로세스라 파드 상태에는
          # OOMKilled 가 아니라 Error(exit 137) 로 보였다.
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
              cpu: "500m"
          # 메모리를 올려 파드가 안정된 뒤 실제로 응답을 확인하고 붙인 probe 다.
          # /health/liveliness 와 /health/readiness 둘 다 200 을 준다.
          # /health 도 200 이지만 그쪽은 프로세스가 아니라 config 에 걸린 백엔드
          # 모델들의 상태라, 맥북 Ollama 가 꺼져 있으면 unhealthy 가 잡힌다.
          # probe 에 쓰면 백엔드가 죽었다고 litellm 을 죽이게 되므로 쓰지 않는다.
          #
          # 기동에 80초쯤 걸려서 startupProbe 로 먼저 기다린다(최대 150초).
          # 이게 통과하기 전에는 liveness 가 돌지 않으므로 기동 중에 죽지 않는다.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: litellm-config

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: chroma-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      # Chroma 와 같은 이유다. 같은 네임스페이스의 chroma 서비스 때문에
      # CHROMA_PORT=tcp://... 가 자동 주입되는데, 이 파드는 CHROMA_URL 을 직접
      # 읽으므로 이름이 비슷한 변수가 섞여 있을 이유가 없다.
      enableServiceLinks: false
      containers:
        - name: api
          # 이미지를 따로 만들지 않고 기동할 때 소스를 받아 설치한다.
          #
          # wizparking 처럼 GHCR 로 굽는 편이 낫지만, 그러려면 Local-RAG 용
          # 러너 등록이 먼저 필요하다. 그때까지는 이 방식으로 둔다. 대신
          # 대가가 분명하다 — 기동에 2 분쯤 걸리고, PyPI 나 GitHub 가 죽으면
          # 파드가 뜨지 않는다. startupProbe 를 넉넉히 잡아 둔 이유다.
          #
          # 어느 커밋이 도는지도 고정되지 않는다. main 을 받아오므로 파드를
          # 다시 띄우면 그 시점의 코드가 뜬다. 이미지로 바꾸면 태그가 곧
          # 커밋이 되어 이 문제도 같이 없어진다.
          image: docker.io/python:3.12-slim
          env:
            - name: HOME
              value: /app
            # 클러스터 안이라 인그레스를 안 탄다. Service 로 직접 붙으므로
            # basicAuth 자격증명이 URL 에 없다.
            - name: CHROMA_URL
              valueFrom:
                secretKeyRef:
                  name: chroma-client
                  key: CHROMA_URL
            # 임베딩(bge-m3)과 생성(qwen2.5:14b) 둘 다 맥북에서 돈다.
            # 맥북이 자면 /search 와 /ask 는 503 을 돌려주고, /search/text 만
            # 계속 동작한다.
            - name: OLLAMA_BASE_URL
              value: "http://192.168.0.44:11434"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git ca-certificates curl >/dev/null
              curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
              export PATH="/app/.local/bin:$PATH"

              git clone -q https://github.com/Ohjinn/Local-RAG.git /app/src
              cd /app/src
              echo "커밋 $(git rev-parse --short HEAD)"
              uv sync --quiet

              # exec 로 바꿔치기해야 uvicorn 이 PID 1 이 되어 SIGTERM 을
              # 직접 받는다. bash 가 남아 있으면 파드 종료 때 신호가 전달되지
              # 않아 30 초 유예를 다 쓰고 강제 종료된다.
              exec uv run uvicorn api:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
              name: http
          # 기동에 apt + uv sync 가 들어가 2 분 안팎 걸린다. 그동안 liveness 가
          # 죽이지 않도록 startupProbe 로 감싸고 한도를 5 분으로 잡는다.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              # langchain 임포트가 제일 무겁다. 임베딩과 생성이 전부 맥북에서
              # 돌기 때문에 여기서 모델이 올라가는 일은 없다.
              memory: "1536Mi"
              cpu: "1000m"
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        # 기동할 때마다 새로 받으므로 남길 것이 없다. 인덱스는 Chroma 의 PVC 에
        # 있고 이 파드는 아무 상태도 갖지 않는다.
        - name: app
          emptyDir:
            sizeLimit: 3Gi

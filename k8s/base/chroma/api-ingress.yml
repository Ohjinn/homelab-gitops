apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-api
  namespace: chroma-system
  annotations:
    # Chroma 와 같은 미들웨어를 그대로 쓴다. 같은 네임스페이스라 참조가 되고,
    # 자격증명도 하나로 유지된다 — 코퍼스를 읽는다는 점에서 둘은 같은 문이다.
    traefik.ingress.kubernetes.io/router.middlewares: chroma-system-chroma-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    # chroma.newhojin.com 과 같은 규칙으로 집 안에서만 풀리게 한다. 공개 DNS 에
    # 올리지 않고 dns-01(192.168.0.102)의 LOCAL_RECORDS 에만 넣는다.
    #
    # 여기가 Chroma 보다 위험한 문이다. Chroma 는 청크를 돌려주지만 이쪽은
    # LLM 이 그것을 읽고 요약해 준다 — 사내 코드와 개인 메모를 사람이 읽기
    # 좋은 형태로 내보내는 셈이라 인증이 더 필요하다.
    - host: rag.newhojin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-api
                port:
                  number: 8000

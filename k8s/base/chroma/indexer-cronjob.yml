apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-indexer
  namespace: chroma-system
spec:
  # 04:30 KST. pve 의 vzdump 백업이 04:00 에 도므로 겹치지 않게 뒤로 뺀다.
  # 클러스터는 UTC 라 19:30 이 04:30 KST 다.
  schedule: "30 19 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # 노드가 꺼져 있다 켜졌을 때 밀린 실행을 몰아서 돌리지 않는다.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 맥북이 자거나 임베딩이 오래 걸려도 하루를 넘기지는 않게 한다.
      activeDeadlineSeconds: 5400
      template:
        spec:
          restartPolicy: Never
          # 서비스 이름이 chroma 라 CHROMA_PORT 같은 변수가 자동 주입되는데,
          # 이 파드는 CHROMA_URL 을 직접 쓰므로 혼선을 없앤다. deployment 쪽과
          # 같은 이유다.
          enableServiceLinks: false
          containers:
            - name: indexer
              image: docker.io/python:3.12-slim
              env:
                - name: HOME
                  value: /work
                - name: CHROMA_URL
                  valueFrom:
                    secretKeyRef:
                      name: chroma-client
                      key: CHROMA_URL
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: rag-git
                      key: GITHUB_TOKEN
                # 임베딩은 맥북에서 돈다. 클러스터 안에서 모델을 올리지 않는
                # 이유는 2 vCPU 로 bge-m3 를 돌리면 몇십 분이 걸리기 때문이다.
                - name: OLLAMA_BASE_URL
                  value: "http://192.168.0.44:11434"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  export PATH="/work/.local/bin:$PATH"

                  echo "=== 준비 ==="
                  apt-get update -qq
                  apt-get install -y -qq --no-install-recommends git ca-certificates curl >/dev/null
                  curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null

                  # 임베딩 서버가 없으면 나머지가 전부 헛수고다. 먼저 확인하고
                  # 없으면 조용히 끝낸다 — 맥북을 들고 나간 날 실패로 기록되어
                  # 알림이 쌓이는 것을 막는다.
                  if ! curl -sf -m 10 "$OLLAMA_BASE_URL/api/tags" >/dev/null; then
                    echo "맥북 Ollama 에 닿지 않는다. 이번 실행은 건너뛴다."
                    exit 0
                  fi

                  echo "=== 클론 ==="
                  AUTH="https://x-access-token:${GITHUB_TOKEN}@github.com/Ohjinn"
                  PUB="https://github.com/Ohjinn"
                  clone() {  # clone <URL베이스> <레포> <목적지>
                    rm -rf "$3"
                    mkdir -p "$(dirname "$3")"
                    # 얕은 클론을 쓰지 않는다. history 카테고리가 커밋 로그를
                    # 코퍼스에 넣으므로 전체 이력이 필요하다.
                    git clone -q "$1/$2.git" "$3"
                    printf '  %-26s %s\n' "$2" "$(git -C "$3" rev-parse --short HEAD)"
                  }
                  clone "$PUB"  homelab-iac              /work/git_code/homelab/homelab-iac
                  clone "$PUB"  homelab-gitops           /work/git_code/homelab/homelab-gitops
                  clone "$PUB"  Local-RAG                /work/Local-RAG
                  clone "$AUTH" homelab-ha               /work/git_code/homelab/homelab-ha
                  clone "$AUTH" wizparking               /work/git_code/apps/wizparking
                  clone "$AUTH" azure-terraform-standard /work/git_code/work/azure-terraform-standard
                  # dotclaude 는 ~/.claude 에 놓여야 한다. collect_docs 가
                  # HOME/.claude 를 context 카테고리로 읽기 때문이다.
                  clone "$AUTH" dotclaude                /work/.claude

                  echo "=== 의존성 ==="
                  cd /work/Local-RAG
                  uv sync --quiet

                  echo "=== 수집 ==="
                  uv run collect_docs.py

                  echo "=== 인덱싱 ==="
                  uv run build_index.py
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  # langchain 임포트가 제일 큰 항목이다. 임베딩이 맥북에서
                  # 도므로 여기서 모델을 올리는 일은 없다.
                  memory: "2Gi"
                  cpu: "1500m"
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            # 매 실행마다 새로 클론하므로 영속 볼륨이 필요 없다. 인덱스는
            # Chroma 서버(PVC)에 있고 이 파드는 아무것도 보관하지 않는다.
            - name: work
              emptyDir:
                sizeLimit: 4Gi

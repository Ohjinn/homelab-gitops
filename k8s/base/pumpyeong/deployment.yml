apiVersion: apps/v1
kind: Deployment
metadata:
  name: pumpyeong
  namespace: pumpyeong-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pumpyeong
  template:
    metadata:
      labels:
        app: pumpyeong
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # 업체 자료(품평회_뷰어.html)는 public 레포에 올리지 않고
            # k3s 노드(192.168.0.151)의 /opt/homelab/pumpyeong 에만 둔다.
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: content
          hostPath:
            path: /opt/homelab/pumpyeong
            type: Directory

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd-config.yml
  - argocd-ingress.yml

patches:
- target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cmd-params-cm
    data:
      server.insecure: "true"
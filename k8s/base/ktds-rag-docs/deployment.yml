apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktds-rag-docs
  namespace: docs-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ktds-rag-docs
  template:
    metadata:
      labels:
        app: ktds-rag-docs
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # 정적 파일 한 장뿐이라 ConfigMap 으로 충분하다. PVC 를 두면
            # 문서를 고칠 때마다 파드에 들어가 파일을 바꿔야 하는데, 그러면
            # 레포와 실제 내용이 갈라진다. ConfigMap 이면 git 이 정본이다.
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          # 컨트롤 플레인이 구형 노트북(i5-8250U)이라 넉넉히 잡지 않는다.
          # nginx alpine 이 정적 파일 하나를 내주는 일이라 이걸로 충분하다.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: html
          configMap:
            # kustomize 의 configMapGenerator 가 내용 해시를 이름에 붙인다.
            # 문서가 바뀌면 이름이 바뀌고 파드가 저절로 굴러간다 — 따로
            # rollout restart 를 칠 필요가 없다.
            name: ktds-rag-docs-html

# Traefik 은 내가 배포한 앱이 아니라 k3s 가 설치할 때 내장 Helm Controller 로
# 깔아준 것이다. 그래서 Deployment 를 직접 고치면 컨트롤러가 되돌려 버린다.
# HelmChartConfig 는 k3s 가 그 상황을 위해 만들어 둔 리소스로, k3s 의 원본
# 매니페스트를 건드리지 않고 차트 값만 덧씌운다. k3s 를 업그레이드해도 남는다.
#
# 이름(traefik)과 네임스페이스(kube-system)는 대상 HelmChart 와 같아야 한다.
# 다르면 조용히 아무 일도 일어나지 않는다.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    logs:
      access:
        # 켜기 전에는 어떤 요청도 기록되지 않았다. 과거 접속 기록은 없다.
        enabled: true

        # 파일이 아니라 stdout 으로 나간다(filePath 를 비워 두면 stdout).
        # 파일로 쓰면 kubelet 의 로그 로테이션 보호를 못 받아서, 봇 스캔이
        # 몰리면 19G 짜리 노드 디스크가 찬다. stdout 이면 컨테이너당
        # 10Mi x 5 로 상한이 자동으로 걸린다.
        #
        # json 으로 남기는 이유는 나중에 Loki 같은 수집기에 물릴 때
        # 파싱이 필요 없기 때문이다.
        format: json

        # 처음에는 필터 없이 전부 남긴다. 봇 스캔이 실제 트래픽의 몇 배씩
        # 오는 경우가 흔한데, 그 비율을 모르는 채로 보관 정책을 정하는 건
        # 추측이다. 일주일 관찰한 뒤 filters.statuscodes 등을 정한다.

        fields:
          headers:
            # 헤더는 기본이 drop 이다. 개인정보 측면에서 맞는 기본값이라
            # 나머지는 그대로 두고 필요한 것만 연다.
            #
            # X-Forwarded-For 를 여는 이유: 앞단에 프록시가 있으면 Traefik 이
            # 보는 접속지는 프록시 주소라 진짜 방문자를 알 수 없다.
            # 다만 이걸 켜면 방문자 IP 를 보관하게 된다. wizparking 은 친구들이
            # 쓰므로 남의 IP 를 갖게 되는 것이고, 그래서 보관 기간을 무한으로
            # 두면 안 된다.
            # User-Agent 는 사람과 스크립트를 가르는 데 쓴다. python-requests
            # 나 Go-http-client 같은 값이 그대로 찍혀서 스캐너가 바로 드러난다.
            names:
              X-Forwarded-For: keep
              User-Agent: keep

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - configmap.yml
  - pvc.yml
  - deployment.yml
  - service.yml
  - ingress.yml

# 앱 소스는 Ohjinn/wizparking 레포에서 이미지로 빌드된다.

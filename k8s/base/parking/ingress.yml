apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parking
  namespace: parking-system
spec:
  ingressClassName: traefik
  rules:
    # Cloudflare Tunnel → cloudflared → Traefik(80) → 이 Ingress(host 매칭)
    # TLS는 Cloudflare 엣지에서 종료, 내부 구간은 HTTP
    - host: wizparking.newhojin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parking
                port:
                  number: 80

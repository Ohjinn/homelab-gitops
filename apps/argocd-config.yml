apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Ohjinn/homelab-gitops.git'
    targetRevision: HEAD
    path: k8s/base/argocd
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Ohjinn/homelab-gitops.git'
    targetRevision: main
    path: k8s/base/openwebui
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openwebui-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
